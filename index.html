<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Forca</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #eaeaea;
      padding: 16px;
      overflow-x: hidden;
    }

    .container {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 28px 32px;
      max-width: 780px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      font-size: 2.4rem;
      margin-bottom: 4px;
      background: linear-gradient(90deg, #ff6b6b, #ee5a24, #ff9ff3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .subtitle {
      text-align: center;
      color: #a0a0b0;
      margin-bottom: 22px;
      font-size: 0.95rem;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .score-box, .record-box {
      background: rgba(255, 255, 255, 0.08);
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .score-box span, .record-box span {
      color: #ff9ff3;
      font-weight: 700;
    }

    .category-select {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
    }

    .category-select option {
      background: #1e1e2f;
      color: #fff;
    }

    .game-area {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      align-items: flex-start;
    }

    .hangman-area {
      flex: 0 0 210px;
      text-align: center;
    }

    .hangman-svg {
      width: 200px;
      height: 240px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    .play-area {
      flex: 1;
      min-width: 280px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 0.9rem;
      color: #bbb;
    }

    .info-row span {
      background: rgba(255, 107, 107, 0.2);
      padding: 3px 12px;
      border-radius: 20px;
      color: #ff6b6b;
      font-weight: 600;
    }

    /* Dica */
    .hint-box {
      background: rgba(255, 107, 107, 0.12);
      border: 1px dashed rgba(255, 107, 107, 0.4);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 16px;
      text-align: center;
      font-size: 0.98rem;
      color: #ffb3c1;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      line-height: 1.4;
    }

    .hint-box.active {
      border-style: solid;
      background: rgba(255, 107, 107, 0.18);
      color: #ffe0e6;
    }

    .word-display {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 18px 0 22px;
      min-height: 52px;
    }

    .letter-box {
      width: 38px;
      height: 48px;
      border-bottom: 3px solid #ff6b6b;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.7rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      transition: all 0.25s ease;
    }

    .letter-box.revealed {
      animation: popIn 0.3s ease;
      color: #2ecc71;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    .letter-box.space {
      border-bottom: none;
      width: 18px;
    }

    /* Teclado */
    .keyboard {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: center;
      margin-bottom: 22px;
    }

    .key {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      user-select: none;
    }

    .key:hover:not(:disabled) {
      background: #ff6b6b;
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(255, 107, 107, 0.35);
    }

    .key:active:not(:disabled) {
      transform: translateY(0);
    }

    .key:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
    }

    .key.correct {
      background: #2ecc71 !important;
      color: #fff;
      box-shadow: 0 0 12px rgba(46, 204, 113, 0.5);
    }

    .key.wrong {
      background: #e74c3c !important;
      color: #fff;
    }

    /* Controles */
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 11px 22px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      color: white;
    }

    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #ddd;
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.18);
    }

    .btn-secondary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-hint {
      background: rgba(255, 159, 243, 0.2);
      color: #ff9ff3;
      border: 1px solid rgba(255, 159, 243, 0.3);
    }

    .btn-hint:hover:not(:disabled) {
      background: rgba(255, 159, 243, 0.3);
    }

    .message {
      text-align: center;
      margin-top: 18px;
      font-size: 1.25rem;
      font-weight: 700;
      min-height: 32px;
      transition: all 0.3s ease;
    }

    .message.win {
      color: #2ecc71;
      animation: pulse 0.6s ease;
    }

    .message.lose {
      color: #e74c3c;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      z-index: 999;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* Responsivo */
    @media (max-width: 620px) {
      .container { padding: 20px 16px; }
      h1 { font-size: 1.9rem; }
      .key { width: 34px; height: 34px; font-size: 0.95rem; }
      .letter-box { width: 30px; height: 40px; font-size: 1.35rem; }
      .hangman-svg { width: 160px; height: 200px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Jogo da Forca</h1>
    <p class="subtitle">Adivinhe a palavra antes que o boneco seja enforcado!</p>

    <div class="top-bar">
      <div class="score-box">⭐ Pontos: <span id="score">0</span></div>
      <div class="record-box">🏆 Recorde: <span id="record">0</span></div>
      <select class="category-select" id="category-select">
        <option value="random">🎲 Aleatório</option>
        <option value="Animais">🐾 Animais</option>
        <option value="Frutas">🍎 Frutas</option>
        <option value="Países">🌍 Países</option>
        <option value="Objetos">📦 Objetos</option>
        <option value="Profissões">💼 Profissões</option>
        <option value="Esportes">⚽ Esportes</option>
      </select>
    </div>

    <div class="game-area">
      <!-- Forca -->
      <div class="hangman-area">
        <svg class="hangman-svg" viewBox="0 0 200 250">
          <!-- Base -->
          <line x1="20" y1="230" x2="110" y2="230" stroke="#8B5A2B" stroke-width="10" stroke-linecap="round"/>
          <!-- Poste -->
          <line x1="45" y1="230" x2="45" y2="25" stroke="#8B5A2B" stroke-width="10" stroke-linecap="round"/>
          <!-- Topo -->
          <line x1="45" y1="25" x2="145" y2="25" stroke="#8B5A2B" stroke-width="10" stroke-linecap="round"/>
          <!-- Corda -->
          <line x1="145" y1="25" x2="145" y2="55" stroke="#D2B48C" stroke-width="5" stroke-linecap="round"/>

          <!-- Cabeça -->
          <circle id="head" cx="145" cy="78" r="22" fill="none" stroke="#f5f5f5" stroke-width="5" style="display:none"/>
          <!-- Olhos (aparecem no final) -->
          <circle id="eyeL" cx="138" cy="74" r="3" fill="#e74c3c" style="display:none"/>
          <circle id="eyeR" cx="152" cy="74" r="3" fill="#e74c3c" style="display:none"/>
          <!-- Boca -->
          <path id="mouth" d="M138 88 Q145 95 152 88" fill="none" stroke="#e74c3c" stroke-width="2.5" style="display:none"/>

          <!-- Corpo -->
          <line id="body" x1="145" y1="100" x2="145" y2="165" stroke="#f5f5f5" stroke-width="5" style="display:none"/>
          <!-- Braços -->
          <line id="armL" x1="145" y1="120" x2="115" y2="150" stroke="#f5f5f5" stroke-width="5" style="display:none"/>
          <line id="armR" x1="145" y1="120" x2="175" y2="150" stroke="#f5f5f5" stroke-width="5" style="display:none"/>
          <!-- Pernas -->
          <line id="legL" x1="145" y1="165" x2="118" y2="210" stroke="#f5f5f5" stroke-width="5" style="display:none"/>
          <line id="legR" x1="145" y1="165" x2="172" y2="210" stroke="#f5f5f5" stroke-width="5" style="display:none"/>
        </svg>
      </div>

      <!-- Área de jogo -->
      <div class="play-area">
        <div class="info-row">
          <div>Erros: <span id="errors">0 / 6</span></div>
          <div>Letras: <span id="used-letters">—</span></div>
        </div>

        <div class="hint-box" id="hint-box">
          Clique em “Dica” para receber uma pista
        </div>

        <div class="word-display" id="word-display"></div>

        <div class="keyboard" id="keyboard"></div>

        <div class="controls">
          <button class="btn btn-primary" id="new-game-btn">🔄 Nova Palavra</button>
          <button class="btn btn-hint" id="hint-btn">💡 Dica</button>
          <button class="btn btn-secondary" id="reveal-btn" disabled>🔤 Revelar Letra</button>
        </div>

        <div class="message" id="message"></div>
      </div>
    </div>
  </div>

  <script>
    // ===== BANCO DE PALAVRAS + DICAS =====
    const words = {
      "Animais": {
        "ELEFANTE": "Maior animal terrestre, tem tromba e grandes orelhas",
        "GIRAFA": "Animal mais alto do mundo, com pescoço bem longo",
        "TIGRE": "Felino listrado de laranja e preto, vive na Ásia",
        "LEAO": "Conhecido como o rei da selva, tem uma grande juba",
        "MACACO": "Animal que vive em árvores e é parecido com o ser humano",
        "CACHORRO": "Melhor amigo do homem, late e abana o rabo",
        "GATO": "Animal doméstico que mia e adora caçar ratos",
        "COELHO": "Animal de orelhas longas que pula e come cenoura",
        "PAPAGAIO": "Ave colorida que consegue imitar a fala humana",
        "CROCODILO": "Réptil grande de água doce com muitos dentes afiados"
      },
      "Frutas": {
        "BANANA": "Fruta amarela alongada, muito comum no café da manhã",
        "LARANJA": "Fruta cítrica redonda e suculenta, rica em vitamina C",
        "MORANGO": "Fruta vermelha pequena com sementes por fora",
        "ABACAXI": "Fruta tropical com casca espinhosa e coroa de folhas",
        "MELANCIA": "Fruta grande, verde por fora e vermelha por dentro no verão",
        "UVA": "Fruta pequena que cresce em cachos e pode ser verde ou roxa",
        "MANGA": "Fruta tropical doce de polpa amarela ou alaranjada",
        "PESSEGO": "Fruta aveludada de cor rosada/alaranjada com caroço",
        "KIWI": "Fruta pequena marrom por fora e verde por dentro com sementes pretas",
        "COCO": "Fruta com casca dura e água doce no interior"
      },
      "Países": {
        "BRASIL": "Maior país da América do Sul, fala português",
        "ARGENTINA": "País vizinho do Brasil famoso pelo tango e pelo futebol",
        "PORTUGAL": "País europeu de onde veio a língua portuguesa",
        "ESPANHA": "País europeu famoso pela paella e pelas touradas",
        "FRANCA": "País europeu conhecido pela Torre Eiffel e pelo vinho",
        "ITALIA": "País em formato de bota, famoso pela pizza e pelo macarrão",
        "JAPAO": "País asiático das tecnologias e do sushi",
        "CANADA": "País da América do Norte famoso pelo xarope de bordo e pelo frio",
        "MEXICO": "País da América do Norte conhecido pelos tacos e pelo Dia dos Mortos",
        "CHILE": "País longo e estreito da América do Sul, entre os Andes e o Pacífico"
      },
      "Objetos": {
        "CADEIRA": "Móvel usado para sentar, tem encosto e pernas",
        "MESA": "Móvel plano usado para colocar objetos ou fazer refeições",
        "COMPUTADOR": "Máquina eletrônica usada para trabalhar, estudar e jogar",
        "TELEFONE": "Aparelho usado para fazer ligações e enviar mensagens",
        "LIVRO": "Conjunto de páginas com texto ou imagens para leitura",
        "CANETA": "Instrumento usado para escrever com tinta",
        "RELOGIO": "Objeto usado para marcar as horas",
        "OCULOS": "Acessório usado no rosto para melhorar a visão",
        "MOCHILA": "Bolsa que se carrega nas costas, usada por estudantes",
        "CHAVE": "Objeto de metal usado para abrir fechaduras"
      },
      "Profissões": {
        "MEDICO": "Profissional que cuida da saúde e trata doenças",
        "PROFESSOR": "Pessoa que ensina alunos em escolas ou universidades",
        "ENGENHEIRO": "Profissional que projeta e constrói máquinas, pontes e prédios",
        "ADVOGADO": "Profissional que defende pessoas na justiça",
        "BOMBEIRO": "Profissional que apaga incêndios e faz resgates",
        "POLICIAL": "Profissional responsável por manter a ordem e a segurança",
        "COZINHEIRO": "Pessoa que prepara refeições em restaurantes",
        "PILOTO": "Profissional que dirige aviões ou helicópteros",
        "JORNALISTA": "Pessoa que escreve notícias e reportagens",
        "ARQUITETO": "Profissional que projeta casas e edifícios"
      },
      "Esportes": {
        "FUTEBOL": "Esporte mais popular do Brasil, jogado com uma bola nos pés",
        "BASQUETE": "Esporte em que se joga a bola em uma cesta alta",
        "VOLEI": "Esporte em que se joga a bola por cima de uma rede com as mãos",
        "TENIS": "Esporte jogado com raquete e uma bolinha amarela",
        "NATACAO": "Esporte praticado dentro da água, em piscinas",
        "ATLETISMO": "Conjunto de provas de corrida, salto e arremesso",
        "HANDEBOL": "Esporte parecido com o futebol, mas jogado com as mãos",
        "CICLISMO": "Esporte praticado com bicicleta",
        "SURFE": "Esporte praticado no mar em cima de uma prancha",
        "BOXE": "Esporte de luta em que se usa luvas e se luta no ringue"
      }
    };

    // ===== ESTADO DO JOGO =====
    let selectedWord = "";
    let selectedCategory = "";
    let selectedHint = "";
    let guessedLetters = [];
    let wrongGuesses = 0;
    const maxWrong = 6;
    let gameOver = false;
    let hintLevel = 0; // 0 = nenhuma, 1 = texto, 2 = letra revelada
    let score = 0;
    let record = parseInt(localStorage.getItem("forcaRecord") || "0");

    // DOM
    const wordDisplay = document.getElementById("word-display");
    const keyboard = document.getElementById("keyboard");
    const errorsEl = document.getElementById("errors");
    const usedLettersEl = document.getElementById("used-letters");
    const messageEl = document.getElementById("message");
    const hintBox = document.getElementById("hint-box");
    const newGameBtn = document.getElementById("new-game-btn");
    const hintBtn = document.getElementById("hint-btn");
    const revealBtn = document.getElementById("reveal-btn");
    const scoreEl = document.getElementById("score");
    const recordEl = document.getElementById("record");
    const categorySelect = document.getElementById("category-select");

    const hangmanParts = ["head", "body", "armL", "armR", "legL", "legR"];
    recordEl.textContent = record;

    // ===== ÁUDIO SIMPLES (Web Audio API) =====
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type, duration, volume = 0.15) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = volume;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    function playCorrect() {
      playTone(523, "sine", 0.12);
      setTimeout(() => playTone(659, "sine", 0.15), 80);
    }

    function playWrong() {
      playTone(220, "sawtooth", 0.25, 0.1);
    }

    function playWin() {
      [523, 659, 784, 1046].forEach((f, i) => {
        setTimeout(() => playTone(f, "sine", 0.2, 0.12), i * 120);
      });
    }

    function playLose() {
      playTone(300, "sawtooth", 0.4, 0.12);
      setTimeout(() => playTone(200, "sawtooth", 0.5, 0.1), 200);
    }

    // ===== CONFETTI =====
    function createConfetti() {
      const colors = ["#ff6b6b", "#2ecc71", "#3498db", "#f1c40f", "#9b59b6", "#ff9ff3"];
      for (let i = 0; i < 60; i++) {
        const conf = document.createElement("div");
        conf.className = "confetti";
        conf.style.left = Math.random() * 100 + "vw";
        conf.style.background = colors[Math.floor(Math.random() * colors.length)];
        conf.style.animationDuration = (Math.random() * 2 + 2) + "s";
        conf.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), 4000);
      }
    }

    // ===== FUNÇÕES DO JOGO =====
    function initKeyboard() {
      keyboard.innerHTML = "";
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(letter => {
        const btn = document.createElement("button");
        btn.className = "key";
        btn.textContent = letter;
        btn.dataset.letter = letter;
        btn.addEventListener("click", () => handleGuess(letter));
        keyboard.appendChild(btn);
      });
    }

    function pickRandomWord() {
      let cat = categorySelect.value;
      if (cat === "random") {
        const cats = Object.keys(words);
        cat = cats[Math.floor(Math.random() * cats.length)];
      }
      selectedCategory = cat;
      const list = Object.keys(words[cat]);
      selectedWord = list[Math.floor(Math.random() * list.length)];
      selectedHint = words[cat][selectedWord];
    }

    function displayWord() {
      wordDisplay.innerHTML = "";
      selectedWord.split("").forEach(char => {
        const box = document.createElement("div");
        box.className = "letter-box";
        if (char === " ") {
          box.classList.add("space");
        } else if (guessedLetters.includes(char)) {
          box.textContent = char;
          box.classList.add("revealed");
        }
        wordDisplay.appendChild(box);
      });
    }

    function updateHangman() {
      hangmanParts.forEach((part, i) => {
        document.getElementById(part).style.display = i < wrongGuesses ? "block" : "none";
      });
      // Rosto triste no final
      const showFace = wrongGuesses >= 6;
      document.getElementById("eyeL").style.display = showFace ? "block" : "none";
      document.getElementById("eyeR").style.display = showFace ? "block" : "none";
      document.getElementById("mouth").style.display = showFace ? "block" : "none";
    }

    function updateInfo() {
      errorsEl.textContent = `${wrongGuesses} / ${maxWrong}`;
      usedLettersEl.textContent = guessedLetters.length ? guessedLetters.join(" ") : "—";
    }

    function handleGuess(letter) {
      if (gameOver || guessedLetters.includes(letter)) return;

      guessedLetters.push(letter);
      const keyBtn = document.querySelector(`.key[data-letter="${letter}"]`);
      if (keyBtn) keyBtn.disabled = true;

      if (selectedWord.includes(letter)) {
        keyBtn.classList.add("correct");
        playCorrect();
        displayWord();
        checkWin();
      } else {
        keyBtn.classList.add("wrong");
        wrongGuesses++;
        playWrong();
        updateHangman();
        updateInfo();
        checkLose();
      }
    }

    function checkWin() {
      const won = selectedWord.split("").every(c => c === " " || guessedLetters.includes(c));
      if (won) {
        gameOver = true;
        const points = Math.max(10, 50 - wrongGuesses * 7 - hintLevel * 8);
        score += points;
        scoreEl.textContent = score;
        if (score > record) {
          record = score;
          localStorage.setItem("forcaRecord", record);
          recordEl.textContent = record;
        }
        messageEl.textContent = `🎉 Você venceu! +${points} pontos`;
        messageEl.className = "message win";
        disableAll();
        playWin();
        createConfetti();
      }
    }

    function checkLose() {
      if (wrongGuesses >= maxWrong) {
        gameOver = true;
        messageEl.textContent = `💀 Você perdeu! A palavra era: ${selectedWord}`;
        messageEl.className = "message lose";
        guessedLetters = [...new Set(selectedWord.split(""))];
        displayWord();
        disableAll();
        playLose();
      }
    }

    function disableAll() {
      document.querySelectorAll(".key").forEach(b => b.disabled = true);
      hintBtn.disabled = true;
      revealBtn.disabled = true;
    }

    function giveHint() {
      if (gameOver || hintLevel >= 1) return;
      hintLevel = 1;
      hintBox.textContent = "💡 " + selectedHint;
      hintBox.classList.add("active");
      hintBtn.disabled = true;
      revealBtn.disabled = false;
    }

    function revealLetter() {
      if (gameOver || hintLevel >= 2) return;
      const remaining = selectedWord.split("").filter(c => c !== " " && !guessedLetters.includes(c));
      if (remaining.length === 0) return;

      const letter = remaining[Math.floor(Math.random() * remaining.length)];
      handleGuess(letter);
      hintLevel = 2;
      revealBtn.disabled = true;
      revealBtn.textContent = "Letra revelada";
    }

    function startNewGame() {
      guessedLetters = [];
      wrongGuesses = 0;
      gameOver = false;
      hintLevel = 0;
      messageEl.textContent = "";
      messageEl.className = "message";

      hintBox.textContent = "Clique em “Dica” para receber uma pista";
      hintBox.classList.remove("active");
      hintBtn.disabled = false;
      revealBtn.disabled = true;
      revealBtn.textContent = "🔤 Revelar Letra";

      pickRandomWord();
      displayWord();
      updateHangman();
      updateInfo();
      initKeyboard();
    }

    // Eventos
    newGameBtn.addEventListener("click", startNewGame);
    hintBtn.addEventListener("click", giveHint);
    revealBtn.addEventListener("click", revealLetter);
    categorySelect.addEventListener("change", startNewGame);

    document.addEventListener("keydown", e => {
      const letter = e.key.toUpperCase();
      if (/^[A-Z]$/.test(letter)) handleGuess(letter);
    });

    // Inicia
    startNewGame();
  </script>
</body>
</html>
