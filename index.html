<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Forca</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }

    #game-container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    canvas {
      border: 1px solid #ddd;
      background-color: #fafafa;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    #hint-display {
      font-style: italic;
      color: #555;
      margin: 10px 0;
    }

    #word-display {
      font-size: 2rem;
      letter-spacing: 10px;
      margin: 15px 0;
    }

    #keyboard {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
    }

    button.key {
      width: 35px;
      height: 35px;
      font-size: 1rem;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #e9e9e9;
    }

    button.key:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    #reset-btn {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <h1>Jogo da Forca</h1>
    <canvas id="hangman" width="200" height="200"></canvas>
    
    <div id="hint-display">Dica: <span id="hint"></span></div>
    <div id="word-display">_ _ _ _</div>
    <div id="keyboard"></div>
    <p id="message"></p>
    <button id="reset-btn" onclick="initGame()">Novo Jogo</button>
  </div>

  <script>
    const wordList = [
      { word: "TECNOLOGIA", hint: "Área ligada a computadores e inovação" },
      { word: "PROGRAMACAO", hint: "Escrita de código para software" },
      { word: "DESENVOLVEDOR", hint: "Pessoa que cria sistemas e apps" },
      { word: "INTERNET", hint: "Rede mundial de computadores" },
      { word: "JAVASCRIPT", hint: "Linguagem de programação para web" }
    ];

    let selectedWord = "";
    let selectedHint = "";
    let guessedWord = [];
    let wrongGuesses = 0;
    const maxWrong = 6;
    let guessedLetters = [];

    const canvas = document.getElementById("hangman");
    const ctx = canvas.getContext("2d");

    function initGame() {
      const randomItem = wordList[Math.floor(Math.random() * wordList.length)];
      selectedWord = randomItem.word;
      selectedHint = randomItem.hint;
      
      guessedWord = Array(selectedWord.length).fill("_");
      wrongGuesses = 0;
      guessedLetters = [];

      document.getElementById("hint").textContent = selectedHint;
      document.getElementById("message").textContent = "";
      
      clearCanvas();
      drawGallows();
      updateDisplay();
      createKeyboard();
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#333";
    }

    function drawGallows() {
      ctx.beginPath();
      // Base
      ctx.moveTo(20, 180);
      ctx.lineTo(180, 180);
      // Poste vertical
      ctx.moveTo(50, 180);
      ctx.lineTo(50, 20);
      // Topo
      ctx.lineTo(130, 20);
      // Corda
      ctx.lineTo(130, 40);
      ctx.stroke();
    }

    function drawHangmanStep(step) {
      ctx.beginPath();
      switch (step) {
        case 1: // Cabeça
          ctx.arc(130, 55, 15, 0, Math.PI * 2);
          break;
        case 2: // Corpo
          ctx.moveTo(130, 70);
          ctx.lineTo(130, 120);
          break;
        case 3: // Braço esquerdo
          ctx.moveTo(130, 85);
          ctx.lineTo(105, 105);
          break;
        case 4: // Braço direito
          ctx.moveTo(130, 85);
          ctx.lineTo(155, 105);
          break;
        case 5: // Perna esquerda
          ctx.moveTo(130, 120);
          ctx.lineTo(110, 155);
          break;
        case 6: // Perna direita
          ctx.moveTo(130, 120);
          ctx.lineTo(150, 155);
          break;
      }
      ctx.stroke();
    }

    function updateDisplay() {
      document.getElementById("word-display").textContent = guessedWord.join(" ");
    }

    function createKeyboard() {
      const keyboard = document.getElementById("keyboard");
      keyboard.innerHTML = "";

      for (let i = 65; i <= 90; i++) {
        const letter = String.fromCharCode(i);
        const btn = document.createElement("button");
        btn.textContent = letter;
        btn.className = "key";
        btn.id = `key-${letter}`;
        btn.onclick = () => handleGuess(letter);
        keyboard.appendChild(btn);
      }
    }

    function handleGuess(letter) {
      if (guessedLetters.includes(letter) || wrongGuesses >= maxWrong) return;

      guessedLetters.push(letter);
      document.getElementById(`key-${letter}`).disabled = true;

      if (selectedWord.includes(letter)) {
        for (let i = 0; i < selectedWord.length; i++) {
          if (selectedWord[i] === letter) {
            guessedWord[i] = letter;
          }
        }
        updateDisplay();
        checkWin();
      } else {
        wrongGuesses++;
        drawHangmanStep(wrongGuesses);
        checkLoss();
      }
    }

    function checkWin() {
      if (!guessedWord.includes("_")) {
        document.getElementById("message").textContent = "Você venceu! 🎉";
        disableAllKeys();
      }
    }

    function checkLoss() {
      if (wrongGuesses === maxWrong) {
        document.getElementById("message").textContent = `Você perdeu! A palavra era: ${selectedWord}`;
        disableAllKeys();
      }
    }

    function disableAllKeys() {
      const buttons = document.querySelectorAll(".key");
      buttons.forEach(btn => btn.disabled = true);
    }

    initGame();
  </script>

</body>
</html>
