<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Forca</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }

    #game-container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    #word-display {
      font-size: 2rem;
      letter-spacing: 10px;
      margin: 20px 0;
    }

    #keyboard {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
    }

    button.key {
      width: 35px;
      height: 35px;
      font-size: 1rem;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #e9e9e9;
    }

    button.key:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    #reset-btn {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <h1>Jogo da Forca</h1>
    <p>Erros restantes: <span id="attempts">6</span></p>
    <div id="word-display">_ _ _ _</div>
    <div id="keyboard"></div>
    <p id="message"></p>
    <button id="reset-btn" onclick="initGame()">Novo Jogo</button>
  </div>

  <script>
    const words = ["TECNOLOGIA", "PROGRAMACAO", "DESENVOLVEDOR", "INTERNET", "NICE"];
    let selectedWord = "";
    let guessedWord = [];
    let remainingAttempts = 6;
    let guessedLetters = [];

    function initGame() {
      selectedWord = words[Math.floor(Math.random() * words.length)];
      guessedWord = Array(selectedWord.length).fill("_");
      remainingAttempts = 6;
      guessedLetters = [];

      document.getElementById("attempts").textContent = remainingAttempts;
      document.getElementById("message").textContent = "";
      updateDisplay();
      createKeyboard();
    }

    function updateDisplay() {
      document.getElementById("word-display").textContent = guessedWord.join(" ");
    }

    function createKeyboard() {
      const keyboard = document.getElementById("keyboard");
      keyboard.innerHTML = "";

      for (let i = 65; i <= 90; i++) {
        const letter = String.fromCharCode(i);
        const btn = document.createElement("button");
        btn.textContent = letter;
        btn.className = "key";
        btn.id = `key-${letter}`;
        btn.onclick = () => handleGuess(letter);
        keyboard.appendChild(btn);
      }
    }

    function handleGuess(letter) {
      if (guessedLetters.includes(letter) || remainingAttempts <= 0) return;

      guessedLetters.push(letter);
      document.getElementById(`key-${letter}`).disabled = true;

      if (selectedWord.includes(letter)) {
        for (let i = 0; i < selectedWord.length; i++) {
          if (selectedWord[i] === letter) {
            guessedWord[i] = letter;
          }
        }
        updateDisplay();
        checkWin();
      } else {
        remainingAttempts--;
        document.getElementById("attempts").textContent = remainingAttempts;
        checkLoss();
      }
    }

    function checkWin() {
      if (!guessedWord.includes("_")) {
        document.getElementById("message").textContent = "Você venceu! 🎉";
        disableAllKeys();
      }
    }

    function checkLoss() {
      if (remainingAttempts === 0) {
        document.getElementById("message").textContent = `Você perdeu! A palavra era: ${selectedWord}`;
        disableAllKeys();
      }
    }

    function disableAllKeys() {
      const buttons = document.querySelectorAll(".key");
      buttons.forEach(btn => btn.disabled = true);
    }

    initGame();
  </script>

</body>
</html>
