<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Forca</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #eaeaea;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 30px 40px;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      color: #a0a0a0;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    .game-area {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
    }

    /* Área do desenho da forca */
    .hangman-area {
      flex: 0 0 220px;
      text-align: center;
    }

    .hangman-svg {
      width: 200px;
      height: 250px;
    }

    /* Área da palavra e teclado */
    .play-area {
      flex: 1;
      min-width: 280px;
    }

    .word-display {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0 30px;
      min-height: 50px;
    }

    .letter-box {
      width: 40px;
      height: 48px;
      border-bottom: 3px solid #e94560;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
    }

    .letter-box.space {
      border-bottom: none;
      width: 20px;
    }

    .info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: #bbb;
    }

    .info span {
      background: rgba(233, 69, 96, 0.2);
      padding: 4px 12px;
      border-radius: 20px;
      color: #ff6b6b;
    }

    /* Teclado */
    .keyboard {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 25px;
    }

    .key {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .key:hover:not(:disabled) {
      background: #e94560;
      transform: translateY(-2px);
    }

    .key:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .key.correct {
      background: #2ecc71;
      color: #fff;
    }

    .key.wrong {
      background: #e74c3c;
      color: #fff;
    }

    /* Botões de controle */
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #e94560, #ff6b6b);
      color: white;
    }

    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(233, 69, 96, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #ddd;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Mensagem de fim de jogo */
    .message {
      text-align: center;
      margin-top: 20px;
      font-size: 1.3rem;
      font-weight: 700;
      min-height: 30px;
    }

    .message.win {
      color: #2ecc71;
    }

    .message.lose {
      color: #e74c3c;
    }

    .category {
      text-align: center;
      color: #ff6b6b;
      font-size: 0.9rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    /* Responsivo */
    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
      h1 {
        font-size: 1.8rem;
      }
      .key {
        width: 36px;
        height: 36px;
        font-size: 1rem;
      }
      .letter-box {
        width: 32px;
        height: 40px;
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Jogo da Forca</h1>
    <p class="subtitle">Adivinhe a palavra antes que o boneco seja enforcado!</p>

    <div class="category" id="category">Categoria: —</div>

    <div class="game-area">
      <!-- Desenho da forca -->
      <div class="hangman-area">
        <svg class="hangman-svg" viewBox="0 0 200 250">
          <!-- Base -->
          <line x1="20" y1="230" x2="100" y2="230" stroke="#8B4513" stroke-width="8" stroke-linecap="round"/>
          <!-- Poste vertical -->
          <line x1="40" y1="230" x2="40" y2="30" stroke="#8B4513" stroke-width="8" stroke-linecap="round"/>
          <!-- Topo -->
          <line x1="40" y1="30" x2="140" y2="30" stroke="#8B4513" stroke-width="8" stroke-linecap="round"/>
          <!-- Corda -->
          <line x1="140" y1="30" x2="140" y2="60" stroke="#D2B48C" stroke-width="4" stroke-linecap="round"/>

          <!-- Cabeça -->
          <circle id="head" cx="140" cy="80" r="20" fill="none" stroke="#eaeaea" stroke-width="4" style="display:none"/>
          <!-- Corpo -->
          <line id="body" x1="140" y1="100" x2="140" y2="160" stroke="#eaeaea" stroke-width="4" style="display:none"/>
          <!-- Braço esquerdo -->
          <line id="armL" x1="140" y1="120" x2="110" y2="145" stroke="#eaeaea" stroke-width="4" style="display:none"/>
          <!-- Braço direito -->
          <line id="armR" x1="140" y1="120" x2="170" y2="145" stroke="#eaeaea" stroke-width="4" style="display:none"/>
          <!-- Perna esquerda -->
          <line id="legL" x1="140" y1="160" x2="115" y2="200" stroke="#eaeaea" stroke-width="4" style="display:none"/>
          <!-- Perna direita -->
          <line id="legR" x1="140" y1="160" x2="165" y2="200" stroke="#eaeaea" stroke-width="4" style="display:none"/>
        </svg>
      </div>

      <!-- Área de jogo -->
      <div class="play-area">
        <div class="info">
          <div>Erros: <span id="errors">0 / 6</span></div>
          <div>Letras usadas: <span id="used-letters">—</span></div>
        </div>

        <div class="word-display" id="word-display"></div>

        <div class="keyboard" id="keyboard"></div>

        <div class="controls">
          <button class="btn btn-primary" id="new-game-btn">Nova Palavra</button>
          <button class="btn btn-secondary" id="hint-btn">Dica</button>
        </div>

        <div class="message" id="message"></div>
      </div>
    </div>
  </div>

  <script>
    // ===== BANCO DE PALAVRAS =====
    const words = {
      "Animais": ["ELEFANTE", "GIRAFA", "TIGRE", "LEAO", "MACACO", "CACHORRO", "GATO", "COELHO", "PAPAGAIO", "CROCODILO"],
      "Frutas": ["BANANA", "LARANJA", "MORANGO", "ABACAXI", "MELANCIA", "UVA", "MANGA", "PESSEGO", "KIWI", "COCO"],
      "Países": ["BRASIL", "ARGENTINA", "PORTUGAL", "ESPANHA", "FRANCA", "ITALIA", "JAPAO", "CANADA", "MEXICO", "CHILE"],
      "Objetos": ["CADEIRA", "MESA", "COMPUTADOR", "TELEFONE", "LIVRO", "CANETA", "RELOGIO", "OCULOS", "MOCHILA", "CHAVE"],
      "Profissões": ["MEDICO", "PROFESSOR", "ENGENHEIRO", "ADVOGADO", "BOMBEIRO", "POLICIAL", "COZINHEIRO", "PILOTO", "JORNALISTA", "ARQUITETO"],
      "Esportes": ["FUTEBOL", "BASQUETE", "VOLEI", "TENIS", "NATACAO", "ATLETISMO", "HANDEBOL", "CICLISMO", "SURFE", "BOXE"]
    };

    // ===== VARIÁVEIS DO JOGO =====
    let selectedWord = "";
    let selectedCategory = "";
    let guessedLetters = [];
    let wrongGuesses = 0;
    const maxWrong = 6;
    let gameOver = false;

    // Elementos DOM
    const wordDisplay = document.getElementById("word-display");
    const keyboard = document.getElementById("keyboard");
    const errorsEl = document.getElementById("errors");
    const usedLettersEl = document.getElementById("used-letters");
    const messageEl = document.getElementById("message");
    const categoryEl = document.getElementById("category");
    const newGameBtn = document.getElementById("new-game-btn");
    const hintBtn = document.getElementById("hint-btn");

    // Partes do boneco (ordem de aparição)
    const hangmanParts = ["head", "body", "armL", "armR", "legL", "legR"];

    // ===== FUNÇÕES =====
    function initKeyboard() {
      keyboard.innerHTML = "";
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      letters.forEach(letter => {
        const btn = document.createElement("button");
        btn.className = "key";
        btn.textContent = letter;
        btn.dataset.letter = letter;
        btn.addEventListener("click", () => handleGuess(letter));
        keyboard.appendChild(btn);
      });
    }

    function pickRandomWord() {
      const categories = Object.keys(words);
      selectedCategory = categories[Math.floor(Math.random() * categories.length)];
      const list = words[selectedCategory];
      selectedWord = list[Math.floor(Math.random() * list.length)];
    }

    function displayWord() {
      wordDisplay.innerHTML = "";
      selectedWord.split("").forEach(char => {
        const box = document.createElement("div");
        box.className = "letter-box";
        if (char === " ") {
          box.classList.add("space");
          box.textContent = "";
        } else {
          box.textContent = guessedLetters.includes(char) ? char : "";
        }
        wordDisplay.appendChild(box);
      });
    }

    function updateHangman() {
      hangmanParts.forEach((part, index) => {
        const el = document.getElementById(part);
        el.style.display = index < wrongGuesses ? "block" : "none";
      });
    }

    function updateInfo() {
      errorsEl.textContent = `${wrongGuesses} / ${maxWrong}`;
      usedLettersEl.textContent = guessedLetters.length ? guessedLetters.join(", ") : "—";
    }

    function handleGuess(letter) {
      if (gameOver || guessedLetters.includes(letter)) return;

      guessedLetters.push(letter);

      // Marca a tecla
      const keyBtn = document.querySelector(`.key[data-letter="${letter}"]`);
      if (keyBtn) keyBtn.disabled = true;

      if (selectedWord.includes(letter)) {
        keyBtn.classList.add("correct");
        displayWord();
        checkWin();
      } else {
        keyBtn.classList.add("wrong");
        wrongGuesses++;
        updateHangman();
        updateInfo();
        checkLose();
      }
    }

    function checkWin() {
      const allGuessed = selectedWord.split("").every(char => 
        char === " " || guessedLetters.includes(char)
      );
      if (allGuessed) {
        gameOver = true;
        messageEl.textContent = "🎉 Parabéns! Você venceu!";
        messageEl.className = "message win";
        disableAllKeys();
      }
    }

    function checkLose() {
      if (wrongGuesses >= maxWrong) {
        gameOver = true;
        messageEl.textContent = `💀 Você perdeu! A palavra era: ${selectedWord}`;
        messageEl.className = "message lose";
        // Revela a palavra
        guessedLetters = selectedWord.split("");
        displayWord();
        disableAllKeys();
      }
    }

    function disableAllKeys() {
      document.querySelectorAll(".key").forEach(btn => btn.disabled = true);
    }

    function giveHint() {
      if (gameOver) return;
      const remaining = selectedWord.split("").filter(c => 
        c !== " " && !guessedLetters.includes(c)
      );
      if (remaining.length === 0) return;

      const hintLetter = remaining[Math.floor(Math.random() * remaining.length)];
      handleGuess(hintLetter);
    }

    function startNewGame() {
      guessedLetters = [];
      wrongGuesses = 0;
      gameOver = false;
      messageEl.textContent = "";
      messageEl.className = "message";

      pickRandomWord();
      categoryEl.textContent = `Categoria: ${selectedCategory}`;
      displayWord();
      updateHangman();
      updateInfo();
      initKeyboard();
    }

    // ===== EVENTOS =====
    newGameBtn.addEventListener("click", startNewGame);
    hintBtn.addEventListener("click", giveHint);

    // Teclado físico
    document.addEventListener("keydown", (e) => {
      const letter = e.key.toUpperCase();
      if (/^[A-Z]$/.test(letter)) {
        handleGuess(letter);
      }
    });

    // Inicia o jogo
    startNewGame();
  </script>
</body>
</html>
