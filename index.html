<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Forca Pro</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text: #1e293b;
      --text-muted: #64748b;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .game-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      margin: 0 0 15px 0;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #312e81;
    }

    .hint-box {
      background-color: #f1f5f9;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 15px;
      border: 1px solid #e2e8f0;
    }

    .hint-box strong {
      color: var(--primary);
    }

    canvas {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      margin-bottom: 10px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }

    .word-display {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 12px;
      color: var(--primary);
      margin: 15px 0;
      min-height: 50px;
      text-indent: 12px;
    }

    .keyboard {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-top: 15px;
    }

    .key {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 12px 0;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 2px 0 #cbd5e1;
    }

    .key:hover:not(:disabled) {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 0 var(--primary-hover);
    }

    .key:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 0 0 transparent;
    }

    .key:disabled {
      background: #f1f5f9;
      color: #cbd5e1;
      cursor: not-allowed;
      border-color: #e2e8f0;
      box-shadow: none;
    }

    .message {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 10px 0;
      min-height: 30px;
      transition: all 0.3s ease;
    }

    .btn-reset {
      margin-top: 15px;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .btn-reset:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>Jogo da Forca</h1>
    
    <div class="hint-box">
      💡 <strong>Dica:</strong> <span id="hint">---</span>
    </div>

    <canvas id="hangman" width="220" height="210"></canvas>
    
    <div id="word-display" class="word-display">_ _ _</div>
    <div id="message" class="message"></div>
    <div id="keyboard" class="keyboard"></div>

    <button class="btn-reset" onclick="initGame()">Novo Jogo</button>
  </div>

  <script>
    const wordList = [
      { word: "OLA", hint: "Uma saudação comum" },
      { word: "TECNOLOGIA", hint: "Área ligada a computadores e inovação" },
      { word: "PROGRAMACAO", hint: "Escrita de código para software" },
      { word: "DESENVOLVEDOR", hint: "Pessoa que cria sistemas e apps" },
      { word: "INTERNET", hint: "Rede mundial de computadores" },
      { word: "JAVASCRIPT", hint: "Linguagem dinâmica para a web" }
    ];

    let selectedWord = "";
    let selectedHint = "";
    let guessedWord = [];
    let wrongGuesses = 0;
    const maxWrong = 6;
    let guessedLetters = [];

    const canvas = document.getElementById("hangman");
    const ctx = canvas.getContext("2d");

    // Gerador de áudio via Web Audio API
    function playSound(type) {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === "correct") {
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } else if (type === "wrong") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } else if (type === "win") {
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      }
    }

    function initGame() {
      const randomItem = wordList[Math.floor(Math.random() * wordList.length)];
      selectedWord = randomItem.word;
      selectedHint = randomItem.hint;
      
      guessedWord = Array(selectedWord.length).fill("_");
      wrongGuesses = 0;
      guessedLetters = [];

      document.getElementById("hint").textContent = selectedHint;
      document.getElementById("message").textContent = "";
      
      clearCanvas();
      drawGallows();
      updateDisplay();
      createKeyboard();
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#312e81";
      ctx.lineCap = "round";
    }

    function drawGallows() {
      ctx.beginPath();
      // Base
      ctx.moveTo(30, 185);
      ctx.lineTo(130, 185);
      // Haste vertical
      ctx.moveTo(60, 185);
      ctx.lineTo(60, 25);
      // Haste superior
      ctx.lineTo(160, 25);
      // Apoio diagonal
      ctx.moveTo(60, 60);
      ctx.lineTo(95, 25);
      // Corda
      ctx.moveTo(160, 25);
      ctx.lineTo(160, 50);
      ctx.stroke();
    }

    function drawHangmanStep(step) {
      ctx.beginPath();
      ctx.strokeStyle = "#ef4444";
      switch (step) {
        case 1: // Cabeça
          ctx.arc(160, 66, 16, 0, Math.PI * 2);
          break;
        case 2: // Corpo
          ctx.moveTo(160, 82);
          ctx.lineTo(160, 130);
          break;
        case 3: // Braço Esquerdo
          ctx.moveTo(160, 95);
          ctx.lineTo(138, 115);
          break;
        case 4: // Braço Direito
          ctx.moveTo(160, 95);
          ctx.lineTo(182, 115);
          break;
        case 5: // Perna Esquerda
          ctx.moveTo(160, 130);
          ctx.lineTo(138, 168);
          break;
        case 6: // Perna Direita
          ctx.moveTo(160, 130);
          ctx.lineTo(182, 168);
          break;
      }
      ctx.stroke();
    }

    function updateDisplay() {
      document.getElementById("word-display").textContent = guessedWord.join(" ");
    }

    function createKeyboard() {
      const keyboard = document.getElementById("keyboard");
      keyboard.innerHTML = "";

      for (let i = 65; i <= 90; i++) {
        const letter = String.fromCharCode(i);
        const btn = document.createElement("button");
        btn.textContent = letter;
        btn.className = "key";
        btn.id = `key-${letter}`;
        btn.onclick = () => handleGuess(letter);
        keyboard.appendChild(btn);
      }
    }

    function handleGuess(letter) {
      if (guessedLetters.includes(letter) || wrongGuesses >= maxWrong) return;

      guessedLetters.push(letter);
      document.getElementById(`key-${letter}`).disabled = true;

      if (selectedWord.includes(letter)) {
        playSound("correct");
        for (let i = 0; i < selectedWord.length; i++) {
          if (selectedWord[i] === letter) {
            guessedWord[i] = letter;
          }
        }
        updateDisplay();
        checkWin();
      } else {
        playSound("wrong");
        wrongGuesses++;
        drawHangmanStep(wrongGuesses);
        checkLoss();
      }
    }

    function checkWin() {
      if (!guessedWord.includes("_")) {
        playSound("win");
        const msg = document.getElementById("message");
        msg.textContent = "Parabéns! Você venceu! 🎉";
        msg.style.color = "var(--success)";
        disableAllKeys();
      }
    }

    function checkLoss() {
      if (wrongGuesses === maxWrong) {
        const msg = document.getElementById("message");
        msg.textContent = `Fim de jogo! A palavra era: ${selectedWord}`;
        msg.style.color = "var(--danger)";
        disableAllKeys();
      }
    }

    function disableAllKeys() {
      const buttons = document.querySelectorAll(".key");
      buttons.forEach(btn => btn.disabled = true);
    }

    initGame();
  </script>

</body>
</html>
