<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Forca • Premium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Tema Escuro (padrão) */
      --bg-1: #0f0c29;
      --bg-2: #302b63;
      --bg-3: #24243e;
      --accent: #ff6b9d;
      --accent-2: #c44569;
      --success: #2ed573;
      --danger: #ff4757;
      --text: #f1f2f6;
      --text-muted: #a4b0be;
      --glass: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.12);
      --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      --particle: rgba(255, 107, 157, 0.35);
      --key-bg: rgba(255, 255, 255, 0.08);
      --hint-bg: rgba(255, 107, 157, 0.08);
      --hint-border: rgba(255, 107, 157, 0.35);
      --hint-text: #ffb3c6;
    }

    [data-theme="light"] {
      --bg-1: #f8f9fc;
      --bg-2: #eef1f8;
      --bg-3: #e4e9f5;
      --accent: #e84393;
      --accent-2: #d63031;
      --success: #00b894;
      --danger: #d63031;
      --text: #2d3436;
      --text-muted: #636e72;
      --glass: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(0, 0, 0, 0.08);
      --card-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.12);
      --particle: rgba(232, 67, 147, 0.25);
      --key-bg: rgba(0, 0, 0, 0.05);
      --hint-bg: rgba(232, 67, 147, 0.08);
      --hint-border: rgba(232, 67, 147, 0.3);
      --hint-text: #c44569;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: linear-gradient(145deg, var(--bg-1), var(--bg-2), var(--bg-3));
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
      padding: 20px;
      overflow-x: hidden;
      transition: background 0.5s ease, color 0.4s ease;
    }

    /* ===== PARTÍCULAS ===== */
    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: var(--particle);
      animation: floatParticle linear infinite;
      opacity: 0;
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }

    /* ===== CONTAINER ===== */
    .container {
      position: relative;
      z-index: 1;
      background: var(--glass);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 32px;
      padding: 36px 40px;
      max-width: 840px;
      width: 100%;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--glass-border);
      transition: all 0.45s ease;
      animation: containerIn 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes containerIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ===== HEADER ===== */
    header {
      text-align: center;
      margin-bottom: 26px;
      position: relative;
    }

    h1 {
      font-size: 2.7rem;
      font-weight: 700;
      letter-spacing: -1.2px;
      background: linear-gradient(90deg, var(--accent), #ff9ff3, #a29bfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
      animation: titleGlow 3s ease-in-out infinite alternate;
    }

    @keyframes titleGlow {
      from { filter: brightness(1); }
      to { filter: brightness(1.15); }
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 400;
    }

    /* Botão de tema */
    .theme-btn {
      position: absolute;
      top: 0;
      right: 0;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--key-bg);
      color: var(--text);
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .theme-btn:hover {
      transform: rotate(20deg) scale(1.1);
      background: var(--accent);
      color: white;
      border-color: transparent;
    }

    /* ===== TOP BAR ===== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .stat {
      background: var(--key-bg);
      border: 1px solid var(--glass-border);
      padding: 10px 18px;
      border-radius: 50px;
      font-size: 0.92rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      transition: all 0.3s ease;
    }

    .stat strong {
      color: var(--accent);
      font-weight: 600;
    }

    .category-select {
      background: var(--key-bg);
      border: 1px solid var(--glass-border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 0.92rem;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      transition: all 0.25s ease;
    }

    .category-select:hover {
      border-color: var(--accent);
    }

    .category-select option {
      background: #1e1e2f;
      color: #fff;
    }

    [data-theme="light"] .category-select option {
      background: #fff;
      color: #2d3436;
    }

    /* ===== GAME AREA ===== */
    .game-area {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      justify-content: center;
      align-items: flex-start;
    }

    .hangman-area {
      flex: 0 0 220px;
      display: flex;
      justify-content: center;
    }

    .hangman-svg {
      width: 200px;
      height: 250px;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.2));
      transition: filter 0.4s ease;
    }

    .play-area {
      flex: 1;
      min-width: 290px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .info-row span {
      background: rgba(255, 107, 157, 0.15);
      color: var(--accent);
      padding: 4px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.88rem;
      transition: all 0.3s ease;
    }

    [data-theme="light"] .info-row span {
      background: rgba(232, 67, 147, 0.12);
    }

    /* Dica */
    .hint-box {
      background: var(--hint-bg);
      border: 1px dashed var(--hint-border);
      border-radius: 16px;
      padding: 14px 18px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 1rem;
      color: var(--hint-text);
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.4s ease;
      line-height: 1.45;
    }

    .hint-box.active {
      border-style: solid;
      box-shadow: 0 0 24px rgba(255, 107, 157, 0.18);
      animation: hintPulse 0.5s ease;
    }

    @keyframes hintPulse {
      0% { transform: scale(0.97); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Palavra */
    .word-display {
      display: flex;
      justify-content: center;
      gap: 9px;
      flex-wrap: wrap;
      margin: 10px 0 26px;
      min-height: 56px;
    }

    .letter-box {
      width: 42px;
      height: 52px;
      border-bottom: 3px solid rgba(255, 107, 157, 0.65);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.85rem;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    [data-theme="light"] .letter-box {
      border-bottom-color: rgba(232, 67, 147, 0.55);
    }

    .letter-box.revealed {
      animation: letterPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--success);
      border-bottom-color: var(--success);
    }

    @keyframes letterPop {
      0% { transform: scale(0.3) rotate(-8deg); opacity: 0; }
      60% { transform: scale(1.18) rotate(3deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    .letter-box.space {
      border-bottom: none;
      width: 20px;
    }

    /* Teclado */
    .keyboard {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 26px;
    }

    .key {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 12px;
      background: var(--key-bg);
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.22s ease;
      text-transform: uppercase;
      user-select: none;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.08);
    }

    .key:hover:not(:disabled) {
      background: var(--accent);
      color: white;
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(255, 107, 157, 0.4);
    }

    .key:active:not(:disabled) {
      transform: translateY(0);
    }

    .key:disabled {
      opacity: 0.32;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none;
    }

    .key.correct {
      background: var(--success) !important;
      color: #fff !important;
      box-shadow: 0 0 16px rgba(46, 213, 115, 0.45);
      animation: keyCorrect 0.4s ease;
    }

    .key.wrong {
      background: var(--danger) !important;
      color: #fff !important;
      animation: keyWrong 0.35s ease;
    }

    @keyframes keyCorrect {
      0% { transform: scale(1); }
      40% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes keyWrong {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }

    /* Botões */
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 13px 24px;
      border: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      box-shadow: 0 4px 18px rgba(255, 107, 157, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(255, 107, 157, 0.45);
    }

    .btn-hint {
      background: rgba(255, 159, 243, 0.15);
      color: #ff9ff3;
      border: 1px solid rgba(255, 159, 243, 0.25);
    }

    [data-theme="light"] .btn-hint {
      background: rgba(232, 67, 147, 0.1);
      color: #e84393;
      border-color: rgba(232, 67, 147, 0.25);
    }

    .btn-hint:hover:not(:disabled) {
      background: rgba(255, 159, 243, 0.28);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--key-bg);
      color: var(--text-muted);
      border: 1px solid var(--glass-border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
      color: var(--text);
    }

    [data-theme="light"] .btn-secondary:hover:not(:disabled) {
      background: rgba(0, 0, 0, 0.06);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* Mensagem */
    .message {
      text-align: center;
      margin-top: 22px;
      font-size: 1.3rem;
      font-weight: 600;
      min-height: 34px;
      transition: all 0.35s ease;
    }

    .message.win {
      color: var(--success);
      animation: winPulse 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .message.lose {
      color: var(--danger);
      animation: loseShake 0.5s ease;
    }

    @keyframes winPulse {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes loseShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 9px;
      height: 9px;
      top: -12px;
      z-index: 9999;
      border-radius: 2px;
      animation: fall linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* Responsivo */
    @media (max-width: 640px) {
      .container {
        padding: 24px 16px;
        border-radius: 24px;
      }
      h1 { font-size: 2rem; }
      .theme-btn {
        width: 38px;
        height: 38px;
        font-size: 1.1rem;
      }
      .key {
        width: 36px;
        height: 36px;
        font-size: 0.95rem;
      }
      .letter-box {
        width: 32px;
        height: 44px;
        font-size: 1.4rem;
      }
      .hangman-svg {
        width: 160px;
        height: 200px;
      }
      .btn {
        padding: 11px 18px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <!-- Partículas de fundo -->
  <div id="particles"></div>

  <div class="container">
    <header>
      <h1>Jogo da Forca</h1>
      <p class="subtitle">Adivinhe a palavra antes que o boneco seja enforcado</p>
      <button class="theme-btn" id="theme-btn" title="Alternar tema">🌙</button>
    </header>

    <div class="top-bar">
      <div class="stat">⭐ Pontos: <strong id="score">0</strong></div>
      <div class="stat">🏆 Recorde: <strong id="record">0</strong></div>
      <select class="category-select" id="category-select">
        <option value="random">🎲 Aleatório</option>
        <option value="Animais">🐾 Animais</option>
        <option value="Frutas">🍎 Frutas</option>
        <option value="Países">🌍 Países</option>
        <option value="Objetos">📦 Objetos</option>
        <option value="Profissões">💼 Profissões</option>
        <option value="Esportes">⚽ Esportes</option>
      </select>
    </div>

    <div class="game-area">
      <div class="hangman-area">
        <svg class="hangman-svg" viewBox="0 0 200 260">
          <line x1="25" y1="240" x2="115" y2="240" stroke="#6d4c41" stroke-width="12" stroke-linecap="round"/>
          <line x1="50" y1="240" x2="50" y2="30" stroke="#6d4c41" stroke-width="12" stroke-linecap="round"/>
          <line x1="50" y1="30" x2="148" y2="30" stroke="#6d4c41" stroke-width="12" stroke-linecap="round"/>
          <line x1="50" y1="70" x2="90" y2="30" stroke="#6d4c41" stroke-width="8" stroke-linecap="round"/>
          <line x1="148" y1="30" x2="148" y2="62" stroke="#a1887f" stroke-width="4" stroke-linecap="round"/>

          <circle id="head" cx="148" cy="86" r="24" fill="none" stroke="#f5f5f5" stroke-width="5" style="display:none"/>
          <g id="face" style="display:none">
            <line x1="139" y1="80" x2="145" y2="86" stroke="#ff4757" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="145" y1="80" x2="139" y2="86" stroke="#ff4757" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="151" y1="80" x2="157" y2="86" stroke="#ff4757" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="157" y1="80" x2="151" y2="86" stroke="#ff4757" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M140 98 Q148 90 156 98" fill="none" stroke="#ff4757" stroke-width="2.5" stroke-linecap="round"/>
          </g>

          <line id="body" x1="148" y1="110" x2="148" y2="170" stroke="#f5f5f5" stroke-width="5" style="display:none"/>
          <line id="armL" x1="148" y1="128" x2="118" y2="155" stroke="#f5f5f5" stroke-width="5" style="display:none"/>
          <line id="armR" x1="148" y1="128" x2="178" y2="155" stroke="#f5f5f5" stroke-width="5" style="display:none"/>
          <line id="legL" x1="148" y1="170" x2="120" y2="215" stroke="#f5f5f5" stroke-width="5" style="display:none"/>
          <line id="legR" x1="148" y1="170" x2="176" y2="215" stroke="#f5f5f5" stroke-width="5" style="display:none"/>
        </svg>
      </div>

      <div class="play-area">
        <div class="info-row">
          <div>Erros: <span id="errors">0 / 6</span></div>
          <div>Usadas: <span id="used-letters">—</span></div>
        </div>

        <div class="hint-box" id="hint-box">
          Clique em “Dica” para receber uma pista
        </div>

        <div class="word-display" id="word-display"></div>
        <div class="keyboard" id="keyboard"></div>

        <div class="controls">
          <button class="btn btn-primary" id="new-game-btn">Nova Palavra</button>
          <button class="btn btn-hint" id="hint-btn">💡 Dica</button>
          <button class="btn btn-secondary" id="reveal-btn" disabled>Revelar Letra</button>
        </div>

        <div class="message" id="message"></div>
      </div>
    </div>
  </div>

  <script>
    // ===== PARTÍCULAS =====
    function createParticles() {
      const container = document.getElementById("particles");
      container.innerHTML = "";
      const count = window.innerWidth < 600 ? 18 : 32;

      for (let i = 0; i < count; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        const size = Math.random() * 6 + 3;
        p.style.width = size + "px";
        p.style.height = size + "px";
        p.style.left = Math.random() * 100 + "%";
        p.style.animationDuration = (Math.random() * 12 + 10) + "s";
        p.style.animationDelay = (Math.random() * 10) + "s";
        container.appendChild(p);
      }
    }

    createParticles();
    window.addEventListener("resize", createParticles);

    // ===== TEMA =====
    const themeBtn = document.getElementById("theme-btn");
    const savedTheme = localStorage.getItem("forcaTheme") || "dark";

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "");
      themeBtn.textContent = theme === "light" ? "☀️" : "🌙";
      localStorage.setItem("forcaTheme", theme);
    }

    applyTheme(savedTheme);

    themeBtn.addEventListener("click", () => {
      const current = localStorage.getItem("forcaTheme") || "dark";
      applyTheme(current === "dark" ? "light" : "dark");
    });

    // ===== BANCO DE PALAVRAS =====
    const words = {
      "Animais": {
        "ELEFANTE": "Maior animal terrestre, tem tromba e grandes orelhas",
        "GIRAFA": "Animal mais alto do mundo, com pescoço bem longo",
        "TIGRE": "Felino listrado de laranja e preto, vive na Ásia",
        "LEAO": "Conhecido como o rei da selva, tem uma grande juba",
        "MACACO": "Animal que vive em árvores e é parecido com o ser humano",
        "CACHORRO": "Melhor amigo do homem, late e abana o rabo",
        "GATO": "Animal doméstico que mia e adora caçar ratos",
        "COELHO": "Animal de orelhas longas que pula e come cenoura",
        "PAPAGAIO": "Ave colorida que consegue imitar a fala humana",
        "CROCODILO": "Réptil grande de água doce com muitos dentes afiados"
      },
      "Frutas": {
        "BANANA": "Fruta amarela alongada, muito comum no café da manhã",
        "LARANJA": "Fruta cítrica redonda e suculenta, rica em vitamina C",
        "MORANGO": "Fruta vermelha pequena com sementes por fora",
        "ABACAXI": "Fruta tropical com casca espinhosa e coroa de folhas",
        "MELANCIA": "Fruta grande, verde por fora e vermelha por dentro no verão",
        "UVA": "Fruta pequena que cresce em cachos e pode ser verde ou roxa",
        "MANGA": "Fruta tropical doce de polpa amarela ou alaranjada",
        "PESSEGO": "Fruta aveludada de cor rosada/alaranjada com caroço",
        "KIWI": "Fruta pequena marrom por fora e verde por dentro com sementes pretas",
        "COCO": "Fruta com casca dura e água doce no interior"
      },
      "Países": {
        "BRASIL": "Maior país da América do Sul, fala português",
        "ARGENTINA": "País vizinho do Brasil famoso pelo tango e pelo futebol",
        "PORTUGAL": "País europeu de onde veio a língua portuguesa",
        "ESPANHA": "País europeu famoso pela paella e pelas touradas",
        "FRANCA": "País europeu conhecido pela Torre Eiffel e pelo vinho",
        "ITALIA": "País em formato de bota, famoso pela pizza e pelo macarrão",
        "JAPAO": "País asiático das tecnologias e do sushi",
        "CANADA": "País da América do Norte famoso pelo xarope de bordo e pelo frio",
        "MEXICO": "País da América do Norte conhecido pelos tacos e pelo Dia dos Mortos",
        "CHILE": "País longo e estreito da América do Sul, entre os Andes e o Pacífico"
      },
      "Objetos": {
        "CADEIRA": "Móvel usado para sentar, tem encosto e pernas",
        "MESA": "Móvel plano usado para colocar objetos ou fazer refeições",
        "COMPUTADOR": "Máquina eletrônica usada para trabalhar, estudar e jogar",
        "TELEFONE": "Aparelho usado para fazer ligações e enviar mensagens",
        "LIVRO": "Conjunto de páginas com texto ou imagens para leitura",
        "CANETA": "Instrumento usado para escrever com tinta",
        "RELOGIO": "Objeto usado para marcar as horas",
        "OCULOS": "Acessório usado no rosto para melhorar a visão",
        "MOCHILA": "Bolsa que se carrega nas costas, usada por estudantes",
        "CHAVE": "Objeto de metal usado para abrir fechaduras"
      },
      "Profissões": {
        "MEDICO": "Profissional que cuida da saúde e trata doenças",
        "PROFESSOR": "Pessoa que ensina alunos em escolas ou universidades",
        "ENGENHEIRO": "Profissional que projeta e constrói máquinas, pontes e prédios",
        "ADVOGADO": "Profissional que defende pessoas na justiça",
        "BOMBEIRO": "Profissional que apaga incêndios e faz resgates",
        "POLICIAL": "Profissional responsável por manter a ordem e a segurança",
        "COZINHEIRO": "Pessoa que prepara refeições em restaurantes",
        "PILOTO": "Profissional que dirige aviões ou helicópteros",
        "JORNALISTA": "Pessoa que escreve notícias e reportagens",
        "ARQUITETO": "Profissional que projeta casas e edifícios"
      },
      "Esportes": {
        "FUTEBOL": "Esporte mais popular do Brasil, jogado com uma bola nos pés",
        "BASQUETE": "Esporte em que se joga a bola em uma cesta alta",
        "VOLEI": "Esporte em que se joga a bola por cima de uma rede com as mãos",
        "TENIS": "Esporte jogado com raquete e uma bolinha amarela",
        "NATACAO": "Esporte praticado dentro da água, em piscinas",
        "ATLETISMO": "Conjunto de provas de corrida, salto e arremesso",
        "HANDEBOL": "Esporte parecido com o futebol, mas jogado com as mãos",
        "CICLISMO": "Esporte praticado com bicicleta",
        "SURFE": "Esporte praticado no mar em cima de uma prancha",
        "BOXE": "Esporte de luta em que se usa luvas e se luta no ringue"
      }
    };

    // ===== ESTADO =====
    let selectedWord = "", selectedCategory = "", selectedHint = "";
    let guessedLetters = [], wrongGuesses = 0, gameOver = false, hintLevel = 0;
    let score = 0;
    let record = parseInt(localStorage.getItem("forcaRecord") || "0");
    const maxWrong = 6;

    const wordDisplay = document.getElementById("word-display");
    const keyboard = document.getElementById("keyboard");
    const errorsEl = document.getElementById("errors");
    const usedLettersEl = document.getElementById("used-letters");
    const messageEl = document.getElementById("message");
    const hintBox = document.getElementById("hint-box");
    const newGameBtn = document.getElementById("new-game-btn");
    const hintBtn = document.getElementById("hint-btn");
    const revealBtn = document.getElementById("reveal-btn");
    const scoreEl = document.getElementById("score");
    const recordEl = document.getElementById("record");
    const categorySelect = document.getElementById("category-select");

    const hangmanParts = ["head", "body", "armL", "armR", "legL", "legR"];
    recordEl.textContent = record;

    // Áudio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, duration, volume = 0.11) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = volume;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }
    function playCorrect() { playTone(523, "sine", 0.1); setTimeout(() => playTone(659, "sine", 0.13), 70); }
    function playWrong() { playTone(200, "sawtooth", 0.2, 0.07); }
    function playWin() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => playTone(f, "sine", 0.16, 0.09), i * 100)); }
    function playLose() { playTone(280, "sawtooth", 0.3, 0.09); setTimeout(() => playTone(180, "sawtooth", 0.4, 0.07), 160); }

    function createConfetti() {
      const colors = ["#ff6b9d", "#2ed573", "#54a0ff", "#feca57", "#5f27cd", "#ff9ff3", "#48dbfb"];
      for (let i = 0; i < 80; i++) {
        const conf = document.createElement("div");
        conf.className = "confetti";
        conf.style.left = Math.random() * 100 + "vw";
        conf.style.background = colors[Math.floor(Math.random() * colors.length)];
        conf.style.width = (Math.random() * 9 + 5) + "px";
        conf.style.height = conf.style.width;
        conf.style.animationDuration = (Math.random() * 2.4 + 2) + "s";
        conf.style.borderRadius = Math.random() > 0.4 ? "50%" : "2px";
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), 4800);
      }
    }

    function initKeyboard() {
      keyboard.innerHTML = "";
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(letter => {
        const btn = document.createElement("button");
        btn.className = "key";
        btn.textContent = letter;
        btn.dataset.letter = letter;
        btn.addEventListener("click", () => handleGuess(letter));
        keyboard.appendChild(btn);
      });
    }

    function pickRandomWord() {
      let cat = categorySelect.value;
      if (cat === "random") {
        const cats = Object.keys(words);
        cat = cats[Math.floor(Math.random() * cats.length)];
      }
      selectedCategory = cat;
      const list = Object.keys(words[cat]);
      selectedWord = list[Math.floor(Math.random() * list.length)];
      selectedHint = words[cat][selectedWord];
    }

    function displayWord() {
      wordDisplay.innerHTML = "";
      selectedWord.split("").forEach(char => {
        const box = document.createElement("div");
        box.className = "letter-box";
        if (char === " ") {
          box.classList.add("space");
        } else if (guessedLetters.includes(char)) {
          box.textContent = char;
          box.classList.add("revealed");
        }
        wordDisplay.appendChild(box);
      });
    }

    function updateHangman() {
      hangmanParts.forEach((part, i) => {
        document.getElementById(part).style.display = i < wrongGuesses ? "block" : "none";
      });
      document.getElementById("face").style.display = wrongGuesses >= 6 ? "block" : "none";
    }

    function updateInfo() {
      errorsEl.textContent = `${wrongGuesses} / ${maxWrong}`;
      usedLettersEl.textContent = guessedLetters.length ? guessedLetters.join(" ") : "—";
    }

    function handleGuess(letter) {
      if (gameOver || guessedLetters.includes(letter)) return;
      guessedLetters.push(letter);
      const keyBtn = document.querySelector(`.key[data-letter="${letter}"]`);
      if (keyBtn) keyBtn.disabled = true;

      if (selectedWord.includes(letter)) {
        keyBtn.classList.add("correct");
        playCorrect();
        displayWord();
        checkWin();
      } else {
        keyBtn.classList.add("wrong");
        wrongGuesses++;
        playWrong();
        updateHangman();
        updateInfo();
        checkLose();
      }
    }

    function checkWin() {
      const won = selectedWord.split("").every(c => c === " " || guessedLetters.includes(c));
      if (won) {
        gameOver = true;
        const points = Math.max(10, 55 - wrongGuesses * 8 - hintLevel * 9);
        score += points;
        scoreEl.textContent = score;
        if (score > record) {
          record = score;
          localStorage.setItem("forcaRecord", record);
          recordEl.textContent = record;
        }
        messageEl.textContent = `Parabéns! Você venceu  +${points} pontos`;
        messageEl.className = "message win";
        disableAll();
        playWin();
        createConfetti();
      }
    }

    function checkLose() {
      if (wrongGuesses >= maxWrong) {
        gameOver = true;
        messageEl.textContent = `Você perdeu! A palavra era: ${selectedWord}`;
        messageEl.className = "message lose";
        guessedLetters = [...new Set(selectedWord.split(""))];
        displayWord();
        disableAll();
        playLose();
      }
    }

    function disableAll() {
      document.querySelectorAll(".key").forEach(b => b.disabled = true);
      hintBtn.disabled = true;
      revealBtn.disabled = true;
    }

    function giveHint() {
      if (gameOver || hintLevel >= 1) return;
      hintLevel = 1;
      hintBox.textContent = "💡 " + selectedHint;
      hintBox.classList.add("active");
      hintBtn.disabled = true;
      revealBtn.disabled = false;
    }

    function revealLetter() {
      if (gameOver || hintLevel >= 2) return;
      const remaining = selectedWord.split("").filter(c => c !== " " && !guessedLetters.includes(c));
      if (!remaining.length) return;
      const letter = remaining[Math.floor(Math.random() * remaining.length)];
      handleGuess(letter);
      hintLevel = 2;
      revealBtn.disabled = true;
      revealBtn.textContent = "Letra revelada";
    }

    function startNewGame() {
      guessedLetters = [];
      wrongGuesses = 0;
      gameOver = false;
      hintLevel = 0;
      messageEl.textContent = "";
      messageEl.className = "message";

      hintBox.textContent = "Clique em “Dica” para receber uma pista";
      hintBox.classList.remove("active");
      hintBtn.disabled = false;
      revealBtn.disabled = true;
      revealBtn.textContent = "Revelar Letra";

      pickRandomWord();
      displayWord();
      updateHangman();
      updateInfo();
      initKeyboard();
    }

    newGameBtn.addEventListener("click", startNewGame);
    hintBtn.addEventListener("click", giveHint);
    revealBtn.addEventListener("click", revealLetter);
    categorySelect.addEventListener("change", startNewGame);

    document.addEventListener("keydown", e => {
      const letter = e.key.toUpperCase();
      if (/^[A-Z]$/.test(letter)) handleGuess(letter);
    });

    startNewGame();
  </script>
</body>
</html>
