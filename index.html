<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Forca</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .game-card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 1.8rem;
      color: var(--text);
    }

    .hint-box {
      background-color: #f1f5f9;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .hint-box strong {
      color: var(--primary);
    }

    canvas {
      background: #fafafa;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .word-display {
      font-size: 2.2rem;
      font-weight: bold;
      letter-spacing: 12px;
      color: var(--primary);
      margin: 20px 0;
      min-height: 50px;
    }

    .keyboard {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-top: 20px;
    }

    .key {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 0;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .key:hover:not(:disabled) {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .key:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
      border-color: #cbd5e1;
    }

    .message {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 15px 0 5px 0;
      min-height: 28px;
    }

    .btn-reset {
      margin-top: 15px;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
      width: 100%;
    }

    .btn-reset:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>Jogo da Forca</h1>
    
    <div class="hint-box">
      Dica: <strong id="hint">---</strong>
    </div>

    <canvas id="hangman" width="220" height="230"></canvas>
    
    <div id="word-display" class="word-display">_ _ _</div>
    <div id="message" class="message"></div>
    <div id="keyboard" class="keyboard"></div>

    <button class="btn-reset" onclick="initGame()">Novo Jogo</button>
  </div>

  <script>
    const wordList = [
      { word: "OLA", hint: "Uma saudação comum" },
      { word: "TECNOLOGIA", hint: "Área ligada a computadores e inovação" },
      { word: "PROGRAMACAO", hint: "Escrita de código para software" },
      { word: "DESENVOLVEDOR", hint: "Pessoa que cria sistemas e apps" },
      { word: "INTERNET", hint: "Rede mundial de computadores" }
    ];

    let selectedWord = "";
    let selectedHint = "";
    let guessedWord = [];
    let wrongGuesses = 0;
    const maxWrong = 6;
    let guessedLetters = [];

    const canvas = document.getElementById("hangman");
    const ctx = canvas.getContext("2d");

    function initGame() {
      const randomItem = wordList[Math.floor(Math.random() * wordList.length)];
      selectedWord = randomItem.word;
      selectedHint = randomItem.hint;
      
      guessedWord = Array(selectedWord.length).fill("_");
      wrongGuesses = 0;
      guessedLetters = [];

      document.getElementById("hint").textContent = selectedHint;
      document.getElementById("message").textContent = "";
      
      clearCanvas();
      drawGallows();
      updateDisplay();
      createKeyboard();
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#1e293b";
      ctx.lineCap = "round";
    }

    // Desenha a estrutura da forca idêntica ao rascunho
    function drawGallows() {
      ctx.beginPath();
      // Base inferior
      ctx.moveTo(30, 200);
      ctx.lineTo(130, 200);
      // Haste vertical
      ctx.moveTo(60, 200);
      ctx.lineTo(60, 30);
      // Haste horizontal superior
      ctx.lineTo(160, 30);
      // Suporte diagonal
      ctx.moveTo(60, 70);
      ctx.lineTo(100, 30);
      // Corda
      ctx.moveTo(160, 30);
      ctx.lineTo(160, 60);
      ctx.stroke();
    }

    // Desenha as partes do boneco baseadas nas 6 tentativas
    function drawHangmanStep(step) {
      ctx.beginPath();
      switch (step) {
        case 1: // Cabeça
          ctx.arc(160, 78, 18, 0, Math.PI * 2);
          break;
        case 2: // Tronco
          ctx.moveTo(160, 96);
          ctx.lineTo(160, 145);
          break;
        case 3: // Braço Esquerdo
          ctx.moveTo(160, 108);
          ctx.lineTo(135, 130);
          break;
        case 4: // Braço Direito
          ctx.moveTo(160, 108);
          ctx.lineTo(185, 130);
          break;
        case 5: // Perna Esquerda
          ctx.moveTo(160, 145);
          ctx.lineTo(135, 185);
          break;
        case 6: // Perna Direita
          ctx.moveTo(160, 145);
          ctx.lineTo(185, 185);
          break;
      }
      ctx.stroke();
    }

    function updateDisplay() {
      document.getElementById("word-display").textContent = guessedWord.join(" ");
    }

    function createKeyboard() {
      const keyboard = document.getElementById("keyboard");
      keyboard.innerHTML = "";

      for (let i = 65; i <= 90; i++) {
        const letter = String.fromCharCode(i);
        const btn = document.createElement("button");
        btn.textContent = letter;
        btn.className = "key";
        btn.id = `key-${letter}`;
        btn.onclick = () => handleGuess(letter);
        keyboard.appendChild(btn);
      }
    }

    function handleGuess(letter) {
      if (guessedLetters.includes(letter) || wrongGuesses >= maxWrong) return;

      guessedLetters.push(letter);
      document.getElementById(`key-${letter}`).disabled = true;

      if (selectedWord.includes(letter)) {
        for (let i = 0; i < selectedWord.length; i++) {
          if (selectedWord[i] === letter) {
            guessedWord[i] = letter;
          }
        }
        updateDisplay();
        checkWin();
      } else {
        wrongGuesses++;
        drawHangmanStep(wrongGuesses);
        checkLoss();
      }
    }

    function checkWin() {
      if (!guessedWord.includes("_")) {
        const msg = document.getElementById("message");
        msg.textContent = "Parabéns! Você venceu! 🎉";
        msg.style.color = "#16a34a";
        disableAllKeys();
      }
    }

    function checkLoss() {
      if (wrongGuesses === maxWrong) {
        const msg = document.getElementById("message");
        msg.textContent = `Fim de jogo! A palavra era: ${selectedWord}`;
        msg.style.color = "#dc2626";
        disableAllKeys();
      }
    }

    function disableAllKeys() {
      const buttons = document.querySelectorAll(".key");
      buttons.forEach(btn => btn.disabled = true);
    }

    initGame();
  </script>

</body>
</html>
