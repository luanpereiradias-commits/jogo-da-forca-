<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Forca</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #eaeaea;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 30px 40px;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      color: #a0a0a0;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    .game-area {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
    }

    .hangman-area {
      flex: 0 0 220px;
      text-align: center;
    }

    .hangman-svg {
      width: 200px;
      height: 250px;
    }

    .play-area {
      flex: 1;
      min-width: 280px;
    }

    .word-display {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0 25px;
      min-height: 50px;
    }

    .letter-box {
      width: 40px;
      height: 48px;
      border-bottom: 3px solid #e94560;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
    }

    .letter-box.space {
      border-bottom: none;
      width: 20px;
    }

    .info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 0.95rem;
      color: #bbb;
    }

    .info span {
      background: rgba(233, 69, 96, 0.2);
      padding: 4px 12px;
      border-radius: 20px;
      color: #ff6b6b;
    }

    /* Caixa de dica */
    .hint-box {
      background: rgba(233, 69, 96, 0.15);
      border: 1px solid rgba(233, 69, 96, 0.4);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 1rem;
      color: #ffb3c1;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .hint-box.empty {
      opacity: 0.5;
      border-style: dashed;
    }

    .keyboard {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 25px;
    }

    .key {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .key:hover:not(:disabled) {
      background: #e94560;
      transform: translateY(-2px);
    }

    .key:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .key.correct {
      background: #2ecc71;
      color: #fff;
    }

    .key.wrong {
      background: #e74c3c;
      color: #fff;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #e94560, #ff6b6b);
      color: white;
    }

    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(233, 69, 96, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #ddd;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      margin-top: 20px;
      font-size: 1.3rem;
      font-weight: 700;
      min-height: 30px;
    }

    .message.win {
      color: #2ecc71;
    }

    .message.lose {
      color: #e74c3c;
    }

    .category {
      text-align: center;
      color: #ff6b6b;
      font-size: 0.9rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
      h1 {
        font-size: 1.8rem;
      }
      .key {
        width: 36px;
        height: 36px;
        font-size: 1rem;
      }
      .letter-box {
        width: 32px;
        height: 40px;
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Jogo da Forca</h1>
    <p class="subtitle">Adivinhe a palavra antes que o boneco seja enforcado!</p>

    <div class="category" id="category">Categoria: —</div>

    <div class="game-area">
      <!-- Desenho da forca -->
      <div class="hangman-area">
        <svg class="hangman-svg" viewBox="0 0 200 250">
          <line x1="20" y1="230" x2="100" y2="230" stroke="#8B4513" stroke-width="8" stroke-linecap="round"/>
          <line x1="40" y1="230" x2="40" y2="30" stroke="#8B4513" stroke-width="8" stroke-linecap="round"/>
          <line x1="40" y1="30" x2="140" y2="30" stroke="#8B4513" stroke-width="8" stroke-linecap="round"/>
          <line x1="140" y1="30" x2="140" y2="60" stroke="#D2B48C" stroke-width="4" stroke-linecap="round"/>

          <circle id="head" cx="140" cy="80" r="20" fill="none" stroke="#eaeaea" stroke-width="4" style="display:none"/>
          <line id="body" x1="140" y1="100" x2="140" y2="160" stroke="#eaeaea" stroke-width="4" style="display:none"/>
          <line id="armL" x1="140" y1="120" x2="110" y2="145" stroke="#eaeaea" stroke-width="4" style="display:none"/>
          <line id="armR" x1="140" y1="120" x2="170" y2="145" stroke="#eaeaea" stroke-width="4" style="display:none"/>
          <line id="legL" x1="140" y1="160" x2="115" y2="200" stroke="#eaeaea" stroke-width="4" style="display:none"/>
          <line id="legR" x1="140" y1="160" x2="165" y2="200" stroke="#eaeaea" stroke-width="4" style="display:none"/>
        </svg>
      </div>

      <!-- Área de jogo -->
      <div class="play-area">
        <div class="info">
          <div>Erros: <span id="errors">0 / 6</span></div>
          <div>Letras usadas: <span id="used-letters">—</span></div>
        </div>

        <!-- Caixa de dica -->
        <div class="hint-box empty" id="hint-box">
          Clique em "Dica" para receber uma pista
        </div>

        <div class="word-display" id="word-display"></div>

        <div class="keyboard" id="keyboard"></div>

        <div class="controls">
          <button class="btn btn-primary" id="new-game-btn">Nova Palavra</button>
          <button class="btn btn-secondary" id="hint-btn">Dica</button>
        </div>

        <div class="message" id="message"></div>
      </div>
    </div>
  </div>

  <script>
    // ===== BANCO DE PALAVRAS + DICAS ESPECÍFICAS =====
    const words = {
      "Animais": {
        "ELEFANTE": "Maior animal terrestre, tem tromba e grandes orelhas",
        "GIRAFA": "Animal mais alto do mundo, com pescoço bem longo",
        "TIGRE": "Felino listrado de laranja e preto, vive na Ásia",
        "LEAO": "Conhecido como o rei da selva, tem uma grande juba",
        "MACACO": "Animal que vive em árvores e é parecido com o ser humano",
        "CACHORRO": "Melhor amigo do homem, late e abana o rabo",
        "GATO": "Animal doméstico que mia e adora caçar ratos",
        "COELHO": "Animal de orelhas longas que pula e come cenoura",
        "PAPAGAIO": "Ave colorida que consegue imitar a fala humana",
        "CROCODILO": "Réptil grande de água doce com muitos dentes afiados"
      },
      "Frutas": {
        "BANANA": "Fruta amarela alongada, muito comum no café da manhã",
        "LARANJA": "Fruta cítrica redonda e suculenta, rica em vitamina C",
        "MORANGO": "Fruta vermelha pequena com sementes por fora",
        "ABACAXI": "Fruta tropical com casca espinhosa e coroa de folhas",
        "MELANCIA": "Fruta grande, verde por fora e vermelha por dentro no verão",
        "UVA": "Fruta pequena que cresce em cachos e pode ser verde ou roxa",
        "MANGA": "Fruta tropical doce de polpa amarela ou alaranjada",
        "PESSEGO": "Fruta aveludada de cor rosada/alaranjada com caroço",
        "KIWI": "Fruta pequena marrom por fora e verde por dentro com sementes pretas",
        "COCO": "Fruta com casca dura e água doce no interior"
      },
      "Países": {
        "BRASIL": "Maior país da América do Sul, fala português",
        "ARGENTINA": "País vizinho do Brasil famoso pelo tango e pelo futebol",
        "PORTUGAL": "País europeu de onde veio a língua portuguesa",
        "ESPANHA": "País europeu famoso pela paella e pelas touradas",
        "FRANCA": "País europeu conhecido pela Torre Eiffel e pelo vinho",
        "ITALIA": "País em formato de bota, famoso pela pizza e pelo macarrão",
        "JAPAO": "País asiático das tecnologias e do sushi",
        "CANADA": "País da América do Norte famoso pelo xarope de bordo e pelo frio",
        "MEXICO": "País da América do Norte conhecido pelos tacos e pelo Dia dos Mortos",
        "CHILE": "País longo e estreito da América do Sul, entre os Andes e o Pacífico"
      },
      "Objetos": {
        "CADEIRA": "Móvel usado para sentar, tem encosto e pernas",
        "MESA": "Móvel plano usado para colocar objetos ou fazer refeições",
        "COMPUTADOR": "Máquina eletrônica usada para trabalhar, estudar e jogar",
        "TELEFONE": "Aparelho usado para fazer ligações e enviar mensagens",
        "LIVRO": "Conjunto de páginas com texto ou imagens para leitura",
        "CANETA": "Instrumento usado para escrever com tinta",
        "RELOGIO": "Objeto usado para marcar as horas",
        "OCULOS": "Acessório usado no rosto para melhorar a visão",
        "MOCHILA": "Bolsa que se carrega nas costas, usada por estudantes",
        "CHAVE": "Objeto de metal usado para abrir fechaduras"
      },
      "Profissões": {
        "MEDICO": "Profissional que cuida da saúde e trata doenças",
        "PROFESSOR": "Pessoa que ensina alunos em escolas ou universidades",
        "ENGENHEIRO": "Profissional que projeta e constrói máquinas, pontes e prédios",
        "ADVOGADO": "Profissional que defende pessoas na justiça",
        "BOMBEIRO": "Profissional que apaga incêndios e faz resgates",
        "POLICIAL": "Profissional responsável por manter a ordem e a segurança",
        "COZINHEIRO": "Pessoa que prepara refeições em restaurantes",
        "PILOTO": "Profissional que dirige aviões ou helicópteros",
        "JORNALISTA": "Pessoa que escreve notícias e reportagens",
        "ARQUITETO": "Profissional que projeta casas e edifícios"
      },
      "Esportes": {
        "FUTEBOL": "Esporte mais popular do Brasil, jogado com uma bola nos pés",
        "BASQUETE": "Esporte em que se joga a bola em uma cesta alta",
        "VOLEI": "Esporte em que se joga a bola por cima de uma rede com as mãos",
        "TENIS": "Esporte jogado com raquete e uma bolinha amarela",
        "NATACAO": "Esporte praticado dentro da água, em piscinas",
        "ATLETISMO": "Conjunto de provas de corrida, salto e arremesso",
        "HANDEBOL": "Esporte parecido com o futebol, mas jogado com as mãos",
        "CICLISMO": "Esporte praticado com bicicleta",
        "SURFE": "Esporte praticado no mar em cima de uma prancha",
        "BOXE": "Esporte de luta em que se usa luvas e se luta no ringue"
      }
    };

    // ===== VARIÁVEIS DO JOGO =====
    let selectedWord = "";
    let selectedCategory = "";
    let selectedHint = "";
    let guessedLetters = [];
    let wrongGuesses = 0;
    const maxWrong = 6;
    let gameOver = false;
    let hintUsed = false;

    // Elementos DOM
    const wordDisplay = document.getElementById("word-display");
    const keyboard = document.getElementById("keyboard");
    const errorsEl = document.getElementById("errors");
    const usedLettersEl = document.getElementById("used-letters");
    const messageEl = document.getElementById("message");
    const categoryEl = document.getElementById("category");
    const hintBox = document.getElementById("hint-box");
    const newGameBtn = document.getElementById("new-game-btn");
    const hintBtn = document.getElementById("hint-btn");

    const hangmanParts = ["head", "body", "armL", "armR", "legL", "legR"];

    // ===== FUNÇÕES =====
    function initKeyboard() {
      keyboard.innerHTML = "";
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      letters.forEach(letter => {
        const btn = document.createElement("button");
        btn.className = "key";
        btn.textContent = letter;
        btn.dataset.letter = letter;
        btn.addEventListener("click", () => handleGuess(letter));
        keyboard.appendChild(btn);
      });
    }

    function pickRandomWord() {
      const categories = Object.keys(words);
      selectedCategory = categories[Math.floor(Math.random() * categories.length)];
      const wordList = Object.keys(words[selectedCategory]);
      selectedWord = wordList[Math.floor(Math.random() * wordList.length)];
      selectedHint = words[selectedCategory][selectedWord];
    }

    function displayWord() {
      wordDisplay.innerHTML = "";
      selectedWord.split("").forEach(char => {
        const box = document.createElement("div");
        box.className = "letter-box";
        if (char === " ") {
          box.classList.add("space");
          box.textContent = "";
        } else {
          box.textContent = guessedLetters.includes(char) ? char : "";
        }
        wordDisplay.appendChild(box);
      });
    }

    function updateHangman() {
      hangmanParts.forEach((part, index) => {
        const el = document.getElementById(part);
        el.style.display = index < wrongGuesses ? "block" : "none";
      });
    }

    function updateInfo() {
      errorsEl.textContent = `${wrongGuesses} / ${maxWrong}`;
      usedLettersEl.textContent = guessedLetters.length ? guessedLetters.join(", ") : "—";
    }

    function handleGuess(letter) {
      if (gameOver || guessedLetters.includes(letter)) return;

      guessedLetters.push(letter);

      const keyBtn = document.querySelector(`.key[data-letter="${letter}"]`);
      if (keyBtn) keyBtn.disabled = true;

      if (selectedWord.includes(letter)) {
        keyBtn.classList.add("correct");
        displayWord();
        checkWin();
      } else {
        keyBtn.classList.add("wrong");
        wrongGuesses++;
        updateHangman();
        updateInfo();
        checkLose();
      }
    }

    function checkWin() {
      const allGuessed = selectedWord.split("").every(char => 
        char === " " || guessedLetters.includes(char)
      );
      if (allGuessed) {
        gameOver = true;
        messageEl.textContent = "🎉 Parabéns! Você venceu!";
        messageEl.className = "message win";
        disableAllKeys();
        hintBtn.disabled = true;
      }
    }

    function checkLose() {
      if (wrongGuesses >= maxWrong) {
        gameOver = true;
        messageEl.textContent = `💀 Você perdeu! A palavra era: ${selectedWord}`;
        messageEl.className = "message lose";
        guessedLetters = selectedWord.split("");
        displayWord();
        disableAllKeys();
        hintBtn.disabled = true;
      }
    }

    function disableAllKeys() {
      document.querySelectorAll(".key").forEach(btn => btn.disabled = true);
    }

    function giveHint() {
      if (gameOver || hintUsed) return;

      // Mostra a dica específica
      hintBox.textContent = "💡 " + selectedHint;
      hintBox.classList.remove("empty");

      hintUsed = true;
      hintBtn.disabled = true;
      hintBtn.textContent = "Dica usada";
    }

    function startNewGame() {
      guessedLetters = [];
      wrongGuesses = 0;
      gameOver = false;
      hintUsed = false;
      messageEl.textContent = "";
      messageEl.className = "message";

      // Reseta a caixa de dica
      hintBox.textContent = "Clique em \"Dica\" para receber uma pista";
      hintBox.classList.add("empty");
      hintBtn.disabled = false;
      hintBtn.textContent = "Dica";

      pickRandomWord();
      categoryEl.textContent = `Categoria: ${selectedCategory}`;
      displayWord();
      updateHangman();
      updateInfo();
      initKeyboard();
    }

    // ===== EVENTOS =====
    newGameBtn.addEventListener("click", startNewGame);
    hintBtn.addEventListener("click", giveHint);

    // Teclado físico
    document.addEventListener("keydown", (e) => {
      const letter = e.key.toUpperCase();
      if (/^[A-Z]$/.test(letter)) {
        handleGuess(letter);
      }
    });

    // Inicia o jogo
    startNewGame();
  </script>
</body>
</html>
